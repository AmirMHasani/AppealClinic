# AppealClinic — Render Blueprint (Free Web Service)
# Canonical deploy steps: docs/deploy-cheap.md
#
# Persistence:
#   - DATABASE_URL unset → JSON store (ephemeral on Free)
#   - DATABASE_URL set   → Prisma Postgres (production path)
# Stripe: leave unset (last). No PHI.
services:
  - type: web
    name: appealclinic
    runtime: node
    plan: free
    # prisma generate always; db-release runs migrate deploy only when DATABASE_URL is set
    buildCommand: bun install --frozen-lockfile && bunx prisma generate && bash scripts/db-release.sh && bun run build
    startCommand: bun run start
    healthCheckPath: /
    envVars:
      - key: APP_MODE
        value: demo
      - key: REQUIRE_REDACTION_CHECK
        value: "true"
      - key: AUTH_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      # Set DATABASE_URL in the Render dashboard after creating Neon/Render Postgres.
      # Leave STRIPE_* unset (Stripe last)
